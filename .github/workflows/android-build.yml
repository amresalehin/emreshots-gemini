name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install verified ExifTool Android runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          RUNTIME_APK="$RUNNER_TEMP/exiftoolwrapper-arm64.apk"
          curl -fsSL -o "$RUNTIME_APK" "https://github.com/bestvibes/exiftoolwrapper-android/releases/download/release-20260610/ExifToolWrapper-release-20260610-arm64-v8a.apk"
          test "$(stat -c %s "$RUNTIME_APK")" = "22377307"
          gh attestation verify "$RUNTIME_APK" -R bestvibes/exiftoolwrapper-android
          unzip -q "$RUNTIME_APK" -d "$RUNNER_TEMP/exiftoolwrapper"
          cp "$RUNNER_TEMP/exiftoolwrapper/lib/arm64-v8a/"lib*.so app/src/main/jniLibs/arm64-v8a/
          cp "$RUNNER_TEMP/exiftoolwrapper/assets/perl5.tar" app/src/main/assets/perl5.tar
          test -s app/src/main/jniLibs/arm64-v8a/libperl.so
          test -s app/src/main/assets/perl5.tar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-disabled: true
      - name: Prepare bundled offline OCR LLM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          MODEL="app/src/main/assets/models/SmolLM2-135M-Instruct-Q2_K.gguf"
          URL="https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q2_K.gguf"
          SHA256="741ad12b64088fedc17c33aacb22e48be1972ef36a39f03666dd68bd15614fb9"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 900 -o "$MODEL" "$URL"
          echo "$SHA256  $MODEL" | sha256sum -c -
          test "$(stat -c %s "$MODEL")" -gt 80000000
          echo "Bundled OCR LLM verified: $(du -h "$MODEL" | cut -f1)"

      - name: Build and test
        run: gradle build --stacktrace

      - name: Assemble installable release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$BT/zipalign" -c -v 4 "$apk"
            "$BT/apksigner" verify --verbose "$apk"
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: emreshots-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
