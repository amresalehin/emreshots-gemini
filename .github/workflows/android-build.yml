name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# New commits on the same PR supersede older builds. Avoid burning runner time
# on commits that can no longer be merged as the PR head.
concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache verified ExifTool Android runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/emreshots/exiftoolwrapper-arm64.apk
          key: emreshots-exiftoolwrapper-release-20260610-arm64-v8a-22377307-v1

      - name: Install verified ExifTool Android runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets "$HOME/.cache/emreshots"
          RUNTIME_APK="$HOME/.cache/emreshots/exiftoolwrapper-arm64.apk"
          if [[ ! -s "$RUNTIME_APK" ]] || [[ "$(stat -c %s "$RUNTIME_APK")" != "22377307" ]]; then
            rm -f "$RUNTIME_APK"
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 30 -o "$RUNTIME_APK" "https://github.com/bestvibes/exiftoolwrapper-android/releases/download/release-20260610/ExifToolWrapper-release-20260610-arm64-v8a.apk"
          else
            echo "Using cached ExifTool runtime APK."
          fi
          test "$(stat -c %s "$RUNTIME_APK")" = "22377307"
          gh attestation verify "$RUNTIME_APK" -R bestvibes/exiftoolwrapper-android
          rm -rf "$RUNNER_TEMP/exiftoolwrapper"
          unzip -q "$RUNTIME_APK" -d "$RUNNER_TEMP/exiftoolwrapper"
          cp "$RUNNER_TEMP/exiftoolwrapper/lib/arm64-v8a/"lib*.so app/src/main/jniLibs/arm64-v8a/
          cp "$RUNNER_TEMP/exiftoolwrapper/assets/perl5.tar" app/src/main/assets/perl5.tar
          test -s app/src/main/jniLibs/arm64-v8a/libperl.so
          test -s app/src/main/assets/perl5.tar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          # Gradle User Home caching is enabled by default.

      - name: Build, test, and assemble release APK
        run: gradle --build-cache --configuration-cache --parallel --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$BT/zipalign" -c -v 4 "$apk"
            "$BT/apksigner" verify --verbose "$apk"
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: emreshots-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
