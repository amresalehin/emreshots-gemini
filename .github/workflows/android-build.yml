name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Load native build pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          . native/PINS
          {
            echo "perl_cross_tag=${PERL_CROSS_TAG}"
            echo "ndk_version=${NDK_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gpg curl tar make patch xz-utils

      - name: Check out pinned perl-cross
        run: git clone --depth 1 --branch "${{ steps.pins.outputs.perl_cross_tag }}" https://github.com/arsv/perl-cross.git native/perl-cross

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.pins.outputs.ndk_version }}

      - name: Build real Perl + ExifTool runtime
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          SOURCE_DATE_EPOCH: "1735689600"
        run: |
          set -euo pipefail
          native/build.sh all

      - name: Install native runtime into Android project
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "native/out/$abi/libperl.so" "app/src/main/jniLibs/$abi/"
            cp native/out/$abi/jniLibs/lib*.so "app/src/main/jniLibs/$abi/"
          done
          mkdir -p app/src/main/assets
          cp native/out/assets/perl5.tar app/src/main/assets/perl5.tar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build and test
        run: gradle build --stacktrace

      - name: Assemble installable release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$BT/zipalign" -c -v 4 "$apk"
            "$BT/apksigner" verify --verbose "$apk"
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: emreshots-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
